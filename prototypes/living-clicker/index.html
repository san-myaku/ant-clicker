px}.role-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.role-row>div{display:flex;align-items:center;gap:9px}.role-row button{min-width:40px;padding:4px}.role-row b{min-width:25px;text-align:center;font-variant-numeric:tabular-nums}.notice,.space-status{font-size:11px;color:var(--muted);margin-top:9px}.space-status{line-height:1.7}.research-open{width:100%;display:flex;justify-content:space-between;align-items:center}.research-open span{font-size:12px;color:var(--muted)}summary{cursor:pointer;font-weight:600;font-size:13px}.selection{font-size:12px;margin-top:10px}.selection .line{padding-top:4px;color:var(--muted)}.detail-controls{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}.detail-controls label{display:block;font-size:12px}.detail-controls input{min-width:0;max-width:100%;display:block;margin-top:4px;font-size:16px}.detail-controls input[type=number]{width:100%;border:1px solid var(--strong);padding:6px;background:#fff}.detail-buttons{display:flex;gap:5px;flex-wrap:wrap}.detail-buttons button{min-height:36px;padding:4px 9px;font-size:12px}.settings p{font-size:12px;color:var(--muted);margin-top:10px}.settings a{font-size:12px}.journal{padding:0;list-style:none;font-size:11px;color:var(--muted);margin:0}.journal li+li{margin-top:7px}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 20px;border-top:1px solid var(--strong);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.counts{display:flex;gap:12px;flex-wrap:wrap}.message-visible{color:var(--accent);font-size:12px;padding:0 16px}.message-visible:empty{display:none}.cause{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}

.app,.app *,dialog,dialog *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}button,summary,a,select{touch-action:manipulation}input,textarea{-webkit-user-select:text!important;user-select:text!important}
@media(max-width:820px){.head{padding:10px 12px;gap:8px}h1{font-size:18px}.transport{gap:5px}.head button{min-width:72px;font-size:12px;padding:5px 8px}.speed{gap:4px}.speed select{font-size:16px;padding:4px}.speed>span{display:none}.top-stats{padding:8px 12px;gap:22px}.top-stats strong{font-size:22px}.top-stats>div{display:block;line-height:1.2}.top-stats span{display:block;font-size:11px;margin-bottom:3px}.top-stats .depth{align-self:center}.workspace{grid-template-columns:1fr}.canvas-wrap{position:relative;height:53dvh;min-height:370px}.inspector{border-left:0;border-top:1px solid var(--strong);display:grid;grid-template-columns:1fr 1fr}.section{padding:14px}.resources,.roles{grid-column:1/-1}.resources{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.resources .brood{align-items:center}.resources .laying-controls{min-width:0}.lay{margin-top:0}.cause{grid-column:1/-1;margin:0}.resources>.notice{display:none}.roles-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.role-row{display:block;margin:0}.role-row>span{font-size:12px}.role-row>div{margin-top:5px;gap:4px;justify-content:space-between}.role-row button{min-width:38px}.role-row b{min-width:18px}.research-section,.selection-section,.settings,.journal-section{grid-column:1/-1}.journal-section{display:none}.space-status{font-size:11px}.footer{padding:8px 12px}.view-controls{right:9px;bottom:9px}.settings .detail-controls{gap:12px}.research-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}.research-detail{padding:14px 12px}.research-list{max-height:60dvh}.research-item{padding:9px 7px;font-size:12px;display:block}.research-item small{display:block;margin:3px 0 0}.research-detail h3{font-size:16px}.research-detail p{font-size:12px}}
@media(max-width:360px){.top-stats{gap:18px}.top-stats strong{font-size:20px}.top-stats .depth{font-size:12px}.roles-list{gap:10px}.role-row button{min-width:36px}.resources{gap:9px}.brood{gap:6px}.brood strong{font-size:19px}.resource-bottom{gap:3px}.resource-bottom button{padding:3px 5px}.canvas-wrap{min-height:340px}}
.section{min-width:0}.detail-controls input[type=file]{width:100%}

<main class="app">
<header class="head"><h1>ありクリッカー</h1><div class="transport"><button id="play" aria-pressed="false">一時停止</button><label class="speed"><span>速度</span><select id="speed" aria-label="時間の進む速さ"><option value="1">1倍</option><option value="2">2倍</option><option value="3">3倍</option><option value="4">4倍</option><option value="5">5倍</option><option value="6">6倍</option><option value="7">7倍</option><option value="8">8倍</option><option value="9">9倍</option><option value="10">10倍</option></select></label></div></header>
<div class="top-stats"><div><span>働き手</span><strong id="ant-count">12</strong></div><div><span>餌</span><strong id="food">6</strong></div><div><span>クッキー</span><strong id="cookies">0</strong></div><div id="depth" class="depth">第1層</div></div>
<div class="workspace">
<section class="world" aria-label="巣の観察"><div class="canvas-wrap"><canvas id="nest" tabindex="0" aria-label="アリが採集・育児・掘削をする巣。ドラッグで移動、ピンチで拡大縮小、アリや卵を選択できます。"></canvas><div class="view-controls"><button id="zoom-out" aria-label="縮小">−</button><button id="focus">女王室</button><button id="fit">全体</button><button id="zoom-in" aria-label="拡大">＋</button></div></div></section>
<aside class="inspector" aria-label="コロニーの育成">
<section class="section resources"><div class="brood"><div><strong id="egg-count">3</strong><span>卵</span></div><div><strong id="larva-count">0</strong><span>幼虫</span></div><div><strong id="pupa-count">0</strong><span>蛹</span></div></div><div class="laying-controls"><button class="lay" id="lay">産卵を助ける</button><div class="meter"><i id="queen-progress"></i></div><div class="resource-bottom"><span id="queen-note"></span><button id="laying" aria-pressed="true">産卵中</button></div></div><p id="food-note" class="notice"></p><p id="cause" class="cause" aria-live="polite">女王室から、巣づくりを始めよう。</p></section>
<section class="section roles"><h2>仕事の配分</h2><div class="roles-list"><div class="role-row"><span>採集</span><div><button data-role="forage" data-delta="-1" aria-label="採集係を1匹減らす">−</button><b id="role-forage">4</b><button data-role="forage" data-delta="1" aria-label="採集係を1匹増やす">＋</button></div></div><div class="role-row"><span>育児</span><div><button data-role="nurse" data-delta="-1" aria-label="育児係を1匹減らす">−</button><b id="role-nurse">4</b><button data-role="nurse" data-delta="1" aria-label="育児係を1匹増やす">＋</button></div></div><div class="role-row"><span>掘削</span><div><button data-role="build" data-delta="-1" aria-label="掘削係を1匹減らす">−</button><b id="role-build">4</b><button data-role="build" data-delta="1" aria-label="掘削係を1匹増やす">＋</button></div></div><div class="role-row"><span>見張り</span><div><button data-role="guard" data-delta="-1" aria-label="見張りを1匹減らす">−</button><b id="role-guard">0</b><button data-role="guard" data-delta="1" aria-label="見張りを1匹増やす">＋</button></div></div></div><p id="role-note" class="notice"></p><p id="space-note" class="space-status"></p></section>
<section class="section research-section"><button id="open-research" class="research-open"><b>研究</b><span id="research-summary"></span></button></section>
<section class="section selection-section"><details id="selection-detail"><summary>選択した対象</summary><div id="selection" class="selection"></div></details></section>
<section class="section journal-section"><ol id="journal" class="journal"></ol></section>
<p id="message" class="message-visible" role="status"></p>
<section class="section settings"><details id="settings"><summary>保存・設定</summary><p>自動保存します。閉じている間は時間が止まります。</p><div class="detail-controls"><div class="detail-buttons"><button id="save">保存</button><button id="restore">保存から再開</button><button id="export">書き出す</button><button id="undo">一つ前の巣へ</button></div><label>保存データを開く<input id="import" type="file" accept="application/json,.json"></label><label>地形の種<input id="seed" type="number" min="1" max="4294967295" value="24014"></label><div class="detail-buttons"><button id="reset">この巣を最初から</button><button id="new-seed">別の地形</button></div><a href="/clicker-previous/">前の統合確認版と保存した巣</a><a href="/">掘削の試作を開く</a></div></details></section>
</aside></div>
<footer class="footer"><div class="counts"><span>羽化 <b id="births">0</b>匹</span><span>給餌 <b id="meals">0</b>回</span><span>採集 <b id="harvest">0</b>個</span><span>掘削 <b id="dig-count">0</b>匹</span><span>運搬 <b id="haul-count">0</b>匹</span></div><span>搬出 <b id="delivered">0</b>粒 / <span id="elapsed">0:00</span></span></footer>
</main>
<dialog id="research-dialog" aria-labelledby="research-title"><div class="dialog-head"><h2 id="research-title">研究</h2><button id="close-research" aria-label="研究を閉じる">×</button></div><div class="research-layout"><div id="research-list" class="research-list"></div><section class="research-detail"><h3 id="research-name"></h3><p id="research-effect"></p><p id="research-cost"></p><p id="research-condition" class="muted"></p><button id="research-buy" class="buy">研究する</button></section></div></dialog>
<script src="core.js"></script><script src="lifecycle.js"></script><script src="game.js"></script><script src="view.js"></script>
</body></html>
