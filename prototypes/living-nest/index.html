<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>掘って育つ巣 — ありクリッカー試作14</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:light;--bg:#e8e8e6;--panel:#f3f3f1;--ink:#202020;--muted:#62625e;--line:#c9c9c5;--strong:#9d9d98;--accent:#bc582e}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.55 "Yu Gothic UI",Meiryo,system-ui,sans-serif}button,select,input{font:inherit;color:inherit}button,select{min-height:36px;border:1px solid var(--strong);border-radius:4px;background:var(--panel);padding:5px 12px}button{cursor:pointer}button:hover{background:#dededb}button:active{background:#cececa}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed="true"]{background:#353532;color:#fff;border-color:#353532}button:disabled{opacity:.5;cursor:default}input{accent-color:var(--accent)}input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--strong);border-radius:2px;background:white}h1,h2,p{margin:0}h1{font-size:23px;line-height:1.25;font-weight:650;letter-spacing:.02em}h2{font-size:14px;font-weight:650}small,.muted{color:var(--muted)}
    .app{max-width:1560px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid var(--line)}.head{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--strong)}.kicker{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.transport button{min-width:92px}.speed{display:flex;gap:6px;align-items:center;font-size:12px}.scenario{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}.scenario label{display:flex;align-items:center;gap:8px}.scenario p{flex:1;min-width:220px;color:var(--muted);font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;flex:1}.world{position:relative;min-width:0;background:#dcd6ca;overflow:hidden}.canvas-wrap{height:calc(100dvh - 174px);min-height:580px;max-height:1050px;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.view-controls{position:absolute;right:14px;bottom:15px;display:flex;gap:4px}.view-controls button{min-width:38px;min-height:38px;padding:5px 10px;background:#eeeeecee}.canvas-help{position:absolute;left:15px;bottom:16px;color:#5c554a;font-size:11px;pointer-events:none}.inspector{border-left:1px solid var(--strong);background:var(--panel)}.section{padding:18px 18px 16px;border-bottom:1px solid var(--line)}.section>h2{margin-bottom:10px}.resource{margin-bottom:17px}.resource:last-child{margin-bottom:0}.resource-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.resource-line strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.resource-line span{font-size:12px;color:var(--muted)}.meter{height:5px;background:#dadad5;margin:7px 0 8px}.meter i{display:block;height:100%;max-width:100%;background:#7b806c}.meter.over i{background:var(--accent)}.resource-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.resource-bottom button{min-height:32px;padding:3px 9px;font-size:12px}.segments{display:flex;width:100%}.segments button{flex:1;border-radius:0;padding-inline:4px;font-size:13px}.segments button+button{border-left:0}.segments button:first-child{border-radius:4px 0 0 4px}.segments button:last-child{border-radius:0 4px 4px 0}.selection{min-height:96px;font-size:13px}.selection b{font-weight:600}.selection .line{display:flex;justify-content:space-between;padding-top:5px;color:var(--muted)}.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}.legend span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:4px;background:#25241f}.legend .soil::before{background:#c89846}.legend .dig::before{background:transparent;border:1px dashed #bc582e;width:8px;height:8px}.journal{font-size:12px;color:var(--muted);padding-left:16px;margin:0}.journal li{margin-bottom:7px}.journal time{font-variant-numeric:tabular-nums;font-size:11px;margin-right:5px}details{font-size:12px}summary{cursor:pointer;font-size:13px;font-weight:600}details p{margin-top:9px;color:var(--muted)}.detail-controls{display:grid;gap:10px;margin-top:12px}.detail-controls label{display:flex;align-items:center;gap:7px}.detail-buttons{display:flex;gap:6px;flex-wrap:wrap}.detail-buttons button{font-size:12px;min-height:32px;padding:4px 9px}.file-input{max-width:100%;font-size:11px}.footer{display:flex;gap:16px;justify-content:space-between;align-items:center;border-top:1px solid var(--strong);padding:9px 24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.counts{display:flex;gap:13px;flex-wrap:wrap}.status-message{color:var(--accent);font-size:12px;min-height:19px}.notice{font-size:11px;color:var(--muted);margin-top:11px}
    @media(max-width:820px){.head{padding:14px 16px;gap:12px;align-items:flex-start}h1{font-size:20px}.kicker{font-size:10px}.transport{gap:5px;justify-content:flex-end}.transport button{min-width:80px;font-size:12px;min-height:34px;padding:5px 8px}.speed{gap:4px}.speed select{min-height:34px;font-size:12px;padding:4px 6px}.scenario{padding:10px 16px;gap:7px}.scenario label{width:100%}.scenario select{flex:1;min-width:0}.scenario p{font-size:12px;min-width:0}.workspace{grid-template-columns:1fr}.canvas-wrap{height:min(57dvh,560px);min-height:380px;max-height:none}.canvas-help{bottom:58px;left:12px;max-width:185px;font-size:10px}.view-controls{right:10px;bottom:10px}.inspector{border-left:0;border-top:1px solid var(--strong);display:grid;grid-template-columns:1fr 1fr}.section{padding:15px 16px}.section:nth-child(odd){border-right:1px solid var(--line)}.resources,.settings{grid-column:1/-1;border-right:0!important}.resources{display:grid;grid-template-columns:1fr 1fr;gap:18px}.resources>h2{grid-column:1/-1;margin-bottom:0}.resource{margin:0}.resource-line strong{font-size:20px}.resource-line span{font-size:11px}.resource-bottom{align-items:flex-start;flex-direction:column;gap:6px}.selection{font-size:12px}.legend{gap:8px;font-size:10px}.footer{padding:10px 16px;gap:8px;align-items:flex-start;flex-direction:column;font-size:11px}.counts{gap:10px}.journal-section{display:none}}
    .canvas-help{background:#eeeeecdd;padding:3px 6px;border-radius:2px;color:#4d4a42}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
<main class="app">
  <header class="head">
    <div><p class="kicker">ありクリッカー / 独立試作 14</p><h1>掘って育つ巣</h1></div>
    <div class="transport"><button id="play" aria-pressed="false">一時停止</button><label class="speed">速度<select id="speed" aria-label="時間の進む速さ"><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option><option value="6">6倍</option><option value="8">8倍</option><option value="10">10倍</option></select></label></div>
  </header>
  <div class="scenario"><label>状況<select id="scenario"><option value="" selected disabled>状況を変える…</option><option value="nursery">幼虫が増えた</option><option value="food">食料が増えた</option><option value="both">どちらも増えた</option></select></label><p id="cause" aria-live="polite">育児室の不足を確認しています。</p></div>
  <div class="workspace">
    <section class="world" aria-label="育つ巣">
      <div class="canvas-wrap"><canvas id="nest" tabindex="0" aria-label="アリが掘削と土の運搬をする巣。ドラッグで移動、プラスとマイナスで拡大縮小、アリや土を選択できます。"></canvas>
      <p class="canvas-help" id="canvas-help">アリ・土を選択 / ドラッグで移動</p><div class="view-controls"><button id="object-mode" aria-pressed="false">つまむ</button><button id="zoom-out" aria-label="縮小">−</button><button id="fit">全体</button><button id="zoom-in" aria-label="拡大">＋</button></div></div>
    </section>
    <aside class="inspector" aria-label="コロニーの状況と操作">
      <section class="section resources"><h2>空間の余裕</h2>
        <div class="resource"><div class="resource-line"><h2>幼虫</h2><div><strong id="larvae">24</strong><span> / <span id="larvae-cap">—</span> 匹</span></div></div><div class="meter" id="larvae-meter"><i></i></div><div class="resource-bottom"><span id="larvae-need">—</span><button id="add-larvae">24匹増やす</button></div></div>
        <div class="resource"><div class="resource-line"><h2>食料</h2><div><strong id="food">32</strong><span> / <span id="food-cap">—</span></span></div></div><div class="meter" id="food-meter"><i></i></div><div class="resource-bottom"><span id="food-need">—</span><button id="add-food">40増やす</button></div></div>
      </section>
      <section class="section"><h2>優先する仕事</h2><div class="segments" aria-label="掘削の優先度"><button data-priority="balanced" aria-pressed="true">均等</button><button data-priority="nursery" aria-pressed="false">育児</button><button data-priority="food" aria-pressed="false">貯蔵</button></div><p class="notice">空間が足りたら、掘削は止まります。</p></section>
      <section class="section"><h2>選択した対象</h2><div id="selection" class="selection">アリや土を選ぶと、いまの仕事や荷物が見られます。</div><div class="legend"><span>アリ</span><span class="soil">運ぶ土</span></div></section>
      <section class="section journal-section"><h2>巣のできごと</h2><ol id="journal" class="journal"></ol></section>
      <section class="section settings"><details id="settings"><summary>保存・試作設定</summary><div class="detail-controls"><label><input id="hard-dig" type="checkbox">硬い土も掘れるようにする</label><div class="detail-buttons"><button id="save">保存</button><button id="restore">保存から再開</button><button id="export">書き出す</button></div><label>保存データを開く<input class="file-input" id="import" type="file" accept="application/json,.json"></label><label>地形の種<input id="seed" type="number" min="1" max="4294967295" value="24014"></label><div class="detail-buttons"><button id="reset">この種で最初から</button><button id="new-seed">別の地形</button></div></div><div id="message" class="status-message" role="status"></div></details></section>
    </aside>
  </div>
  <footer class="footer"><div class="counts"><span>アリ <b id="ant-count">24</b>匹</span><span>移動 <b id="travel-count">0</b></span><span>掘削 <b id="dig-count">0</b></span><span>運搬 <b id="haul-count">0</b></span><span>休憩 <b id="idle-count">24</b></span></div><span>運び出した砂 <b id="delivered">0</b>粒 / <span id="elapsed">0:00</span></span></footer>
</main>
<script src="simulation.js"></script>
<script src="view.js"></script>
</body>
</html>
